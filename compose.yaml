x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    logging: *default-logging
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    labels:
      # Select the ingress network when Dokploy also attaches the private app network.
      traefik.docker.network: "${TRAEFIK_NETWORK:-dokploy-network}"
    environment:
      PORT: "8080"
      # pgx reads credentials from PG* variables so passwords need no URL encoding.
      DATABASE_URL: "postgres://db:5432/?sslmode=disable"
      PGUSER: "${POSTGRES_USER:-lernen}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}"
      PGDATABASE: "${POSTGRES_DB:-lernen}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the public origin}"
      MAX_ZONE_PLAYERS: "${MAX_ZONE_PLAYERS:-128}"
    networks:
      - app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/world", "healthcheck"]
      interval: 15s
      timeout: 4s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s

  db:
    logging: *default-logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-lernen}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}"
      POSTGRES_DB: "${POSTGRES_DB:-lernen}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 15s
    stop_grace_period: 60s

networks:
  app:

volumes:
  postgres_data:

# Dokploy: use compose.yaml and route the domain to server:8080 over HTTP.
# Keep the app network on both services when previewing the generated file.
# Local use: docker compose -f compose.yaml -f compose.local.yaml up --build -d
