<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living sprite worlds · glotworld QA</title>
<style>
body{margin:0;background:#132b29;color:#fcf1d8;font:14px system-ui}#world{position:fixed;inset:0}header{position:fixed;z-index:2;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;background:#14352ee8;border:1px solid #9c9c6b}select,button{font:inherit;min-height:44px;padding:8px;background:#fcf1d8;color:#14352e;border:0}label{display:flex;align-items:center;gap:8px;min-height:44px}input{width:20px;height:20px}#status{font-size:12px}canvas{display:block}.controls-hidden header{display:none}
</style></head>
<body><div id="world"></div><header><select id="region" aria-label="Region"><option value="lindenhafen">Lindenhafen</option><option value="waldruh">Waldruh</option><option value="nebelstadt">Nebelstadt</option></select><select id="time" aria-label="Time of day"><option value="12">Calm daytime</option><option value="22">Calm nighttime</option><option value="shared">Live shared time</option></select><label><input type="checkbox" id="terrain">Terrain only</label><label><input type="checkbox" id="calm">Still scenery</label><label><input type="checkbox" id="tour">Camera tour</label><span id="status" role="status">Loading assets…</span></header>
<script type="module">
import { characterCatalogue } from '../src/character-recipe.mjs';
import { World } from '../src/world.ts';
import { interiors } from '../src/interiors.ts';
import { maps, getMap } from '../src/maps.ts';
import {weatherPreviewLabels} from '../src/world-weather.ts';
let world, shownRegion='', sharedStatus='';
// Exercise the real Phaser backing canvas at a requested screen density.
const qaDensity=Number(new URLSearchParams(location.search).get('density'));
const pixelDensity=[1,2].includes(qaDensity)?qaDensity:undefined;
const status=document.querySelector('#status');
const quayTest=new URLSearchParams(location.search).get('test')==='station-quay';
const landTest=new URLSearchParams(location.search).get('test')==='clear-land';
const walkingTest=quayTest||landTest;
const landStarts={lindenhafen:[360,115],waldruh:[103,416],nebelstadt:[560,435]};
if(import.meta.env.DEV){
 const hideControls=document.createElement('button');hideControls.textContent='Hide controls';hideControls.title='Press Escape to restore QA controls';
 hideControls.addEventListener('click',()=>document.body.classList.add('controls-hidden'));
 document.querySelector('header').insertBefore(hideControls,status);
 addEventListener('keydown',event=>{if(event.key==='Escape')document.body.classList.remove('controls-hidden');});
 const capture=document.createElement('button');capture.textContent='Capture native pixels';
 const download=document.createElement('a');download.textContent='Download native PNG';download.hidden=true;download.download='character-scene.png';download.id='native-capture';
 capture.addEventListener('click',()=>{
  download.hidden=true;
  document.body.classList.add('controls-hidden');
  window.atlasGame.renderer.snapshot(image=>{download.href=image.src;download.hidden=false;document.body.classList.remove('controls-hidden');},'image/png');
 });
 document.querySelector('header').insertBefore(capture,status);document.querySelector('header').insertBefore(download,status);
 document.querySelector('#region').innerHTML=maps.map(map=>`<option value="${map.id}">${map.name}</option>`).join('');
 world=new World(document.querySelector('#world'),{pixelDensity,motion:'full',time:{mode:'manual',hour:12},onNpc:()=>{},onMove:()=>{},onReady:()=>{
  if(quayTest)world.setPlayers([{id:'quay-qa',name:'Quay QA',mapId:'lindenhafen',x:1285.632/2304,y:355.328/1536,avatar:{hair:'#53462d',skin:'#d5ad86',outfit:'#397c78'}}],'quay-qa');
  world.setInputEnabled(walkingTest);
 },onMapReady:id=>{
  shownRegion=id;
  if(landTest){const map=getMap(id),[x,y]=landStarts[id];world.setPlayers([{id:'land-qa',name:'Land QA',mapId:id,x:x/map.width,y:y/map.height,avatar:{hair:'#53462d',skin:'#d5ad86',outfit:'#397c78'}}],'land-qa');}
 }});
 world.setInputEnabled(false);
 const rooms = document.createElement('select'); rooms.id = 'interior'; rooms.setAttribute('aria-label', 'Interior');
 rooms.innerHTML = '<option value="">Outdoors</option>' + interiors.map(room => `<option value="${room.id}">${room.name}</option>`).join('');
 document.querySelector('header').insertBefore(rooms, status);
 const conversation=document.createElement('label');conversation.innerHTML='<input type="checkbox" id="conversation" disabled>Greta conversation';
 document.querySelector('header').insertBefore(conversation,status);
 const conversationInput=conversation.querySelector('input');
 conversationInput.addEventListener('change',()=>world.setConversationTarget(conversationInput.checked?'greta':undefined));
 rooms.addEventListener('change', () => {
  conversationInput.checked=false;conversationInput.disabled=rooms.value!=='inn';world.setConversationTarget(undefined);
  rooms.value ? world.enterInterior(rooms.value) : world.leaveInterior();
 });
 const controls = document.createElement('label'); controls.innerHTML = '<input type="checkbox" id="controls">Walk & interact';
 controls.querySelector('input').checked=walkingTest;
 document.querySelector('header').insertBefore(controls, status);
 const foundations=document.createElement('label');foundations.innerHTML='<input type="checkbox" id="foundations" checked>Foundation contact';
 document.querySelector('header').insertBefore(foundations,status);
 const foundationInput=foundations.querySelector('input');
 const showFoundations=()=>window.atlasGame?.scene.getScenes(true).forEach(scene=>{
  scene.scenery?.setGroundContactVisible(foundationInput.checked);scene.previousScenery?.setGroundContactVisible(foundationInput.checked);
 });
 foundationInput.addEventListener('change',showFoundations);
 const buildingPicker=document.createElement('select');buildingPicker.id='building';buildingPicker.setAttribute('aria-label','Inspect building foundation');
 buildingPicker.add(new Option('Inspect building foundation',''));document.querySelector('header').insertBefore(buildingPicker,status);
 let buildingSignature='',inspectionGame;
 const requestedBuilding=new URLSearchParams(location.search).get('building');let requestedBuildingApplied=false;
 const inspectBuilding=()=>{
  if(!buildingPicker.value||rooms.value)return;
  const scene=window.atlasGame?.scene.getScene('world');
  const layer=scene?.scenery?.layers.find(layer=>layer.spec.id===buildingPicker.value);
  if(!layer)return;
  const camera=scene.cameras.main;
  camera.stopFollow();camera.setZoom(camera.width*.72/layer.width).centerOn(layer.spec.x,layer.spec.y-layer.height*.12);
 };
 buildingPicker.addEventListener('change',()=>{
  world.setWatchMode(false);document.querySelector('#tour').checked=false;
  world.observeResident(undefined);world.setInputEnabled(false);controls.querySelector('input').checked=false;
 });
 const updateBuildingPicker=()=>{
  const game=window.atlasGame,scene=game?.scene.getScene('world');
  buildingPicker.disabled=!!rooms.value;
  if(game&&game!==inspectionGame){inspectionGame=game;game.events.on('poststep',inspectBuilding);}
  const buildings=scene?.scenery?.layers.filter(layer=>layer.foundation)??[];
  const signature=`${shownRegion}:${buildings.map(layer=>layer.spec.id).join(',')}`;
  if(signature!==buildingSignature){
   buildingSignature=signature;const selected=buildingPicker.value;
   buildingPicker.replaceChildren(new Option(`Inspect building foundation (${buildings.length})`,''),...buildings.map(layer=>new Option(layer.spec.id.replaceAll('-',' '),layer.spec.id)));
   if(buildings.some(layer=>layer.spec.id===selected))buildingPicker.value=selected;
   if(!requestedBuildingApplied&&shownRegion&&buildings.some(layer=>layer.spec.id===requestedBuilding)){buildingPicker.value=requestedBuilding;requestedBuildingApplied=true;}
  }
 };
 for(const input of [controls.querySelector('input'),document.querySelector('#tour'),rooms])input.addEventListener('change',()=>{buildingPicker.value='';});
 controls.querySelector('input').addEventListener('change', event => world.setInputEnabled(event.target.checked));
 document.querySelector('#region').addEventListener('change',event=>{shownRegion='';world.setMap(event.target.value)});
 const sharedAbort = new AbortController();
 let clockPending = false;
 async function syncSharedClock() {
  if (clockPending || document.querySelector('#time').value !== 'shared') return;
  clockPending = true;
  try {
   const response = await fetch('/api/world-clock', {signal:sharedAbort.signal});
   if (!response.ok) throw new Error('Shared clock unavailable');
   const clock = await response.json();
   world.setSharedClock(clock);
   weather.disabled=true;weather.value='regional';weather.title='Weather follows the shared world.';
   sharedStatus = ` · shared day ${clock.day} · seed ${clock.seed.slice(0,8)}`;
  } catch (error) { if (!sharedAbort.signal.aborted) sharedStatus = ` · ${error.message}`; }
  finally { clockPending = false; }
 }
 const sharedTimer = setInterval(syncSharedClock, 5000);
 document.querySelector('#time').addEventListener('change',event=>{
  const shared = event.target.value === 'shared';
  world.setTimePreference({mode:shared?'cycle':'manual',hour:shared?12:Number(event.target.value)});
  if(shared) void syncSharedClock(); else sharedStatus='';
 });
 document.querySelector('#terrain').addEventListener('change',event=>world.setTerrainOnly(event.target.checked));
 document.querySelector('#calm').addEventListener('change',event=>world.setMotionPreference(event.target.checked?'reduced':'full'));
 document.querySelector('#tour').addEventListener('change',event=>world.setWatchMode(event.target.checked));
 const weather=document.createElement('select');weather.setAttribute('aria-label','Weather preview');weather.replaceChildren(...Object.entries(weatherPreviewLabels).map(([value,label])=>new Option(label,value)));document.querySelector('header').insertBefore(weather,status);
 weather.addEventListener('change',()=>world.setWeatherPreview(weather.value));
 const observer=document.createElement('select');observer.setAttribute('aria-label','Observe resident');observer.innerHTML='<option value="">Follow player</option>';document.querySelector('header').insertBefore(observer,status);
 observer.addEventListener('change',()=>{buildingPicker.value='';world.setWatchMode(false);document.querySelector('#tour').checked=false;world.observeResident(observer.value||undefined);});
 for(const [value,label] of [['8.5','Resident preview 08:30'],['9.5','Resident preview 09:30'],['9.75','Resident preview 09:45'],['10.5','Resident preview 10:30'],['11.5','Resident preview 11:30'],['11.75','Exchange preview 11:45'],['12','Exchange preview 12:00'],['13.25','Exchange preview 13:15'],['14.5','Resident preview 14:30'],['15','Resident preview 15:00'],['17.5','Resident preview 17:30']])document.querySelector('#time').insertAdjacentHTML('beforeend',`<option value="${value}">${label}</option>`);
 const requestedMap=new URLSearchParams(location.search).get('map');if(maps.some(map=>map.id===requestedMap)){document.querySelector('#region').value=requestedMap;world.setMap(requestedMap);}
 let residentIds='';
 const timer=setInterval(()=>{const stats=world.getWorldStats(),clock=world.getWorldTime(),ground=world.getTerrainStats(),residents=world.getActivityResidents();
  showFoundations();
  updateBuildingPicker();
  const ids=residents.map(resident=>resident.id).join(',');if(ids!==residentIds){residentIds=ids;observer.replaceChildren(new Option('Follow player',''),...residents.map(resident=>new Option(resident.name,resident.id)));}
  const observed=residents.find(resident=>resident.id===observer.value);
  const activity=observed?` · ${observed.name}: ${observed.state.phase} ${observed.state.action}${observed.state.activityId?' at '+observed.state.activityId:''}${observed.state.interruption?' · rain response':observed.state.resumed?' · resumed':''}${observed.state.exchange?' · '+observed.state.exchange.stage+' · '+observed.state.exchange.german:''}`:'';
  const player=walkingTest?world.getPlayerPosition():undefined;
  const walking=player?` · Player ${player.x.toFixed(1)}, ${player.y.toFixed(1)} · player art ${characterCatalogue.format.runtimeCell.join('×')} (${characterCatalogue.assetVersion})`:'';
  status.textContent=shownRegion?`${maps.find(map=>map.id===shownRegion).name} · ${clock.label} ${stats.period} · ${pixelDensity??window.devicePixelRatio}× density · ${stats.objects} placed sprites · ${stats.animated} animated · ${stats.residents} residents · ${ground.width}×${ground.height} terrain · ${ground.pixelZoom.toFixed(2)}× pixel zoom · ${ground.textures} ground textures / ${(ground.pixels*4/1024/1024).toFixed(1)} MiB RGBA · ${ground.pending} pending · ${stats.p95FrameMs} ms p95 · ${world.getWeather()?'rain':'dry'}${sharedStatus}${activity}${walking}`:'Loading destination artwork…'},250);
 addEventListener('pagehide',()=>{clearInterval(timer);clearInterval(sharedTimer);inspectionGame?.events.off('poststep',inspectBuilding);sharedAbort.abort();world.destroy()},{once:true});
}else status.textContent='This fixture is available on the development server.';
</script></body></html>
