<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth and occlusion renderer QA</title>
<style>body{margin:0;background:#20352d;color:#f6e6bf;font:14px system-ui}header{padding:16px;display:flex;gap:24px;align-items:center}label{display:flex;align-items:center;gap:10px}canvas{display:block;max-width:100%;margin:auto}input{width:20px;height:20px}#status{font-size:12px}</style></head>
<body><header><strong>Phaser 4.2 scenery occlusion</strong><label><input id="effect" type="checkbox" checked>Behind</label><label><input id="calm" type="checkbox">Reduced motion</label><span id="status">Loading renderer…</span></header><div id="game"></div>
<script type="module">
import * as Phaser from 'phaser';
import { updateOcclusion, worldDepth } from '../src/world-depth.ts';
import { OCCLUDER_FADE } from '../src/world-scenery.ts';
let effects=[],circles=[],elapsed=0;
class TestScene extends Phaser.Scene {
 preload(){this.load.atlas('props','/assets/story-quality-props.webp','/assets/story-quality-props.json');this.load.spritesheet('person','/assets/characters.webp',{frameWidth:256,frameHeight:384});}
 create(){
  this.add.rectangle(640,310,1280,620,0x75916f);
  const labels=['Opaque occluder','Lightened + shimmering silhouette','Mirrored art'];
  for(let i=0;i<3;i++){
   const x=240+i*400;
   this.add.text(x,45,labels[i],{fontSize:'20px',fontFamily:'system-ui',color:'#fff2cb'}).setOrigin(.5);
   const body=this.add.image(x,370,'person',7).setOrigin(.5,.9).setScale(72/338).setDepth(worldDepth(370,'character'));
   const tree=this.add.sprite(x,470,'props','tree').setOrigin(.5,1).setScale(280/677).setFlipX(i===2).setDepth(worldDepth(470));
   const silhouette=this.add.image(x,370,'person',7).setOrigin(body.originX,body.originY).setScale(body.scaleX).setTint(0x1b2a33).setTintMode(Phaser.TintModes.FILL).setDepth(tree.depth+2).setAlpha(0);
   if(i>0)effects.push({x,tree,silhouette});
  }
  document.querySelector('#status').textContent=`${this.game.renderer.type===Phaser.WEBGL?'WebGL':'Canvas'} · whole-object fade · shimmering silhouette`;
 }
 update(_time,delta){
  elapsed+=delta/1000;
  const enabled=document.querySelector('#effect').checked,reduced=document.querySelector('#calm').checked;
  circles=updateOcclusion(circles,enabled?[{id:'player',x:0,y:370,depth:worldDepth(370,'character')}]:[],Math.min(delta,50)/1000,reduced);
  for(const effect of effects){
   const strength=circles[0]?.strength??0,shimmer=reduced?.6:.6+.14*Math.sin(elapsed*Math.PI*1.8);
   effect.tree.setAlpha(1-OCCLUDER_FADE*strength);
   effect.silhouette.setAlpha(shimmer*strength);
  }
 }
}
if(import.meta.env.DEV)new Phaser.Game({type:Phaser.AUTO,parent:'game',width:1280,height:620,backgroundColor:'#20352d',scene:[TestScene],render:{antialias:true,mipmapFilter:'LINEAR_MIPMAP_LINEAR'},banner:false});
</script></body></html>
