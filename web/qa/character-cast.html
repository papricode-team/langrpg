<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPC sprite review</title>
<style>body{font:15px system-ui;color:#243b34;background:#f1ecdf;max-width:1150px;margin:24px auto;padding:0 20px}h1{font:30px Georgia}label{display:inline-grid;gap:6px;margin:0 16px 16px 0}select,button{font:inherit;padding:8px}section{background:#fffbf0;border-radius:12px;padding:18px;margin:18px 0}h2{font:20px Georgia}.row{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;text-align:center}canvas{display:block;background:#cad3bd}figcaption{font-size:12px;margin:8px}#error{color:#a02020}</style>
<h1>NPC sprites · actual game sizes</h1><p>Every story character, regional character, and resident uses the detailed character components. Transparent atlas trimming preserves the original pixels and foot anchors.</p>
<label>Character<select id="actor"></select></label><label>Animation<select id="animation"></select></label><label>Pose<select id="pose"><option value="0">Standing</option><option value="2">Walk 2</option><option value="5">Walk 5</option><option value="8">Walk 8</option><option value="animate">Animate</option></select></label><label>Display density<select id="density"><option value="2">2× Retina</option><option value="1">1×</option></select></label><button id="all">Show all 36 frames</button><p id="status" role="status"></p><p id="error" role="alert"></p><main id="samples"></main>
<script type="module">
import {castActors,castCell,castAssetUrl,castAtlasUrl} from '/src/character-cast.ts';
import {explorationZoom,conversationZoom} from '/src/world-camera.ts';
const actorSelect=document.querySelector('#actor'),animation=document.querySelector('#animation'),pose=document.querySelector('#pose'),density=document.querySelector('#density'),samples=document.querySelector('#samples');
for(const actor of castActors)actorSelect.add(new Option(`${actor.name} · ${actor.mapId??'Story cast'}`,actor.id));
actorSelect.value=new URLSearchParams(location.search).get('actor')??'greta';
let current,ticket=0,column=0,all=false;const resources=new Map();
function options(){current=castActors.find(a=>a.id===actorSelect.value);animation.replaceChildren(new Option('Walk','walk'),...Object.keys(current.poses??{}).map(p=>new Option(p,p)));}
options();
const loadImage=url=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error(`Missing image: ${url}`));image.src=url;});
function load(asset){if(!resources.has(asset))resources.set(asset,(async()=>{const response=await fetch(castAtlasUrl(asset));if(!response.ok)throw Error(`Missing atlas: ${asset.key}`);const atlas=await response.json(),frames=new Map(),pages=atlas.textures??[{frames:atlas.frames}];await Promise.all(pages.map(async page=>{const image=await loadImage(asset.multiAtlas?`/assets/character-cast/${page.image}`:castAssetUrl(asset));for(const [key,frame] of Array.isArray(page.frames)?page.frames.map(f=>[f.filename,f]):Object.entries(page.frames))frames.set(Number(key),{...frame,image});}));return frames;})());return resources.get(asset);}
function draw(context,frame,scale){const r=frame.frame,s=frame.spriteSourceSize;context.drawImage(frame.image,r.x,r.y,r.w,r.h,s.x*scale,s.y*scale,s.w*scale,s.h*scale);}
async function render(){const request=++ticket;try{const asset=animation.value==='walk'?current:current.poses[animation.value],native=animation.value==='walk'?current.native:undefined;const [runtime,nativeFrames]=await Promise.all([load(asset),native?load(native):undefined]);if(request!==ticket)return;
const d=Number(density.value),p=pose.value==='animate'?1+column++%8:Number(pose.value);samples.replaceChildren();
const specs=all?[{label:'All 36 frames',cellCss:192,frames:Array.from({length:36},(_,i)=>i)}]:[{label:'Phone · 390 × 844',width:390,height:844},{label:'Desktop · 1440 × 900',width:1440,height:900},...(native?[{label:'Inn conversation · 1440 × 900',width:1440,height:900,indoor:true,body:240,talking:true}]:[])];
for(const spec of specs){const selected=spec.indoor?native:asset,frames=spec.indoor?nativeFrames:runtime,cell=selected.cell??castCell,body=spec.body??72,zoom=spec.cellCss?undefined:conversationZoom(explorationZoom(spec.width*d,spec.height*d,d,!!spec.indoor,body).zoom,!!spec.talking),cellCss=spec.cellCss??body*zoom/d/(71/96)*2/3,scale=cellCss*d/cell[0],section=document.createElement('section'),h=document.createElement('h2'),row=document.createElement('div');h.textContent=`${spec.label} · ${cell.join('×')} source frames`;row.className='row';section.append(h,row);samples.append(section);
for(const frame of spec.frames??[0,9,18,27].map(f=>f+p)){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=Math.ceil(cell[0]*scale);canvas.height=Math.ceil(cell[1]*scale);canvas.style.width=`${canvas.width/d}px`;canvas.style.height=`${canvas.height/d}px`;draw(canvas.getContext('2d'),frames.get(frame),scale);caption.textContent=`${['Front','Right','Back','Left'][Math.floor(frame/9)]} · ${frame%9}`;figure.append(canvas,caption);row.append(figure);}}
document.querySelector('#error').textContent='';document.querySelector('#status').textContent=`${castActors.length} NPCs · ${castCell.join('×')} outdoor${native?' · '+native.cell.join('×')+' indoors':''} · ${(asset.textureBytes/1024/1024).toFixed(1)} MiB outdoor texture · ${current.id}`;
}catch(error){document.querySelector('#error').textContent=String(error);}}
actorSelect.onchange=()=>{options();all=false;render()};for(const el of [animation,pose,density])el.onchange=()=>{all=false;render()};document.querySelector('#all').onclick=()=>{all=!all;render()};setInterval(()=>{if(pose.value==='animate'&&!all)render()},160);render();
</script></html>
