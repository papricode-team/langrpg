<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player sprite review</title>
<style>
body{font:15px system-ui;color:#243b34;background:#f1ecdf;max-width:1100px;margin:24px auto;padding:0 20px}h1{font:30px Georgia}p{line-height:1.6}label{display:inline-grid;gap:6px;margin:0 16px 16px 0;font-size:13px}select,button{font:inherit;padding:8px;background:#fffcf3;color:inherit;border:1px solid #bcb4a2;border-radius:6px}section{background:#fffbf0;border-radius:12px;padding:18px;margin:18px 0}h2{font:20px Georgia;margin:0 0 16px}.row{display:flex;gap:24px;align-items:end;flex-wrap:wrap}figure{margin:0;text-align:center}canvas{display:block;background:linear-gradient(#c5d4c5,#d8debc);border-radius:8px}figcaption{font-size:12px;margin:8px 0}.old canvas{background:#ddd8cd}#status{min-height:24px}#error{color:#a02020}
</style>
<h1>Player sprites · actual game sizes</h1>
<p>The complete native-detail player wardrobe, rendered with the game’s compositor and camera sizing. Compare all builds, clothing layers, and action poses at their actual display sizes.</p>
<div id="controls"><label>Build<select id="build"></select></label><label>Animation<select id="animation"></select></label><span id="extras"></span><label>Bottom<select id="bottom"><option value="skirt">Skirt</option><option value="straight">Trousers</option></select></label><label>Headwear<select id="hat"><option value="">Hair</option><option value="cap">Cap</option></select></label><label>Pose<select id="pose"><option value="0">Standing</option><option value="2">Walk 2</option><option value="5">Walk 5</option><option value="8">Walk 8</option><option value="animate">Animate</option></select></label><label>Display density<select id="density"><option value="auto">This display</option><option value="1">1×</option><option value="2">2× Retina</option></select></label><label>Clothing color<input id="color" type="color" value="#396f65"></label></div>
<button id="bake">Check complete animation atlas</button><p id="bake-result" role="status"></p>
<p id="status" role="status"></p><p id="error" role="alert"></p><main id="samples"></main>
<script type="module">
import{characterCatalogue,normalizeAvatar}from'/src/character-recipe.mjs';
import{avatarFramePixels,bakeAvatarPixels}from'/src/avatar-baker.ts';
import{explorationZoom,conversationZoom}from'/src/world-camera.ts';
const manifest=await fetch('/assets/character-kit-hd/manifest.json').then(r=>r.json());
const publishedParts=[...characterCatalogue.components,...Object.values(characterCatalogue.poseSets??{}).flatMap(p=>p.components),...Object.values(characterCatalogue.expressions??{}).flatMap(p=>p.components)];
const allParts=manifest.assets.map(asset=>({...publishedParts.find(c=>c.id===asset.id),...asset,tints:Object.fromEntries(asset.materials.map(key=>[key,key==='detail'?null:key==='skin'?'skin':['hair','facial-hair'].includes(asset.slot)?'hair':`${asset.slot}.${key}`]))}));
const cat={...characterCatalogue,assetBase:'/assets/character-kit-hd/',assetVersion:manifest.assetVersion,format:manifest.format,poseSets:undefined,expressions:undefined,components:[]};
const slots=['face','hair','markings','facial-hair','eyewear','top','outer','footwear','neck','bag','held'];
for(const slot of slots){const label=document.createElement('label');label.textContent=({'face':'Face','hair':'Hairstyle','markings':'Markings','facial-hair':'Facial hair','eyewear':'Eyewear','top':'Top','outer':'Jacket','footwear':'Footwear','neck':'Neckwear','bag':'Bag','held':'Held item'})[slot];const select=document.createElement('select');select.id=slot;label.append(select);document.querySelector('#extras').append(label);}
for(const build of [...new Set(allParts.filter(p=>p.slot==='body').map(p=>p.build))])document.querySelector('#build').add(new Option(build,build));
document.querySelector('#build').value='regular';
for(const pose of [...new Set(allParts.map(p=>p.poseSet??'walk'))])document.querySelector('#animation').add(new Option(pose,pose));
function refreshOptions(){const build=document.querySelector('#build').value,animation=document.querySelector('#animation').value;cat.components=allParts.filter(p=>p.build===build&&(p.poseSet??'walk')===animation&&!p.expression);cat.builds=[build];for(const [id,slot]of [...slots.map(s=>[s,s]),['bottom','bottom'],['hat','headwear']]){const select=document.getElementById(id),before=select.value;select.replaceChildren();select.add(new Option('None',''));for(const part of cat.components.filter(p=>p.slot===slot))select.add(new Option(part.label??part.optionId,part.optionId));const preferred=before||({face:'soft',hair:'waves',top:'shirt',bottom:'straight',footwear:'boots'})[slot];if([...select.options].some(o=>o.value===preferred))select.value=preferred;else if(['face','top','bottom','footwear'].includes(slot)&&select.options.length>1)select.selectedIndex=1;}}
refreshOptions();
const sampleSpecs=[{label:'Phone · 390 × 844',width:390,height:844,indoor:false},{label:'Desktop · 1440 × 900',width:1440,height:900,indoor:false},{label:'Conversation · 1920 × 1080',width:1920,height:1080,indoor:true,talking:true},{label:'Inn conversation · 1440 × 900',width:1440,height:900,indoor:true,talking:true,bodyHeight:240}];
const facings=['Front','Right','Back','Left'];let ticket=0,animated=0,frameKey='';const cachedFrames=new Map();
const status=document.querySelector('#status'),samples=document.querySelector('#samples');
function recipeFor(catalogue){const recipe=normalizeAvatar({v:2,build:document.querySelector('#build').value},catalogue);for(const slot of Object.keys(recipe.parts))recipe.parts[slot]=null;for(const slot of slots)recipe.parts[slot]=document.getElementById(slot).value||null;recipe.parts.bottom=document.querySelector('#bottom').value||null;recipe.parts.headwear=document.querySelector('#hat').value||null;recipe.skin='#d8a077';recipe.hair='#493125';for(const key of Object.keys(recipe.colors))recipe.colors[key]=document.querySelector('#color').value;return recipe;}
async function render(){const current=++ticket,pose=document.querySelector('#pose').value,column=pose==='animate'?1+animated++%8:Number(pose),density=document.querySelector('#density').value==='auto'?Math.min(devicePixelRatio,2):Number(document.querySelector('#density').value);status.textContent='Composing player poses…';
try{const recipe=recipeFor(cat),key=JSON.stringify([document.querySelector('#animation').value,recipe]);if(key!==frameKey){cachedFrames.clear();frameKey=key;}if(!cachedFrames.has(column))cachedFrames.set(column,Promise.all([0,1,2,3].map(f=>avatarFramePixels(recipe,f*9+column,{catalogue:cat,preview:true,resolution:'runtime'}))));const frames=await cachedFrames.get(column);document.querySelector('#error').textContent='';if(current!==ticket)return;samples.replaceChildren();
for(const spec of sampleSpecs){const bodyHeight=spec.bodyHeight??(spec.indoor?132:72),zoom=conversationZoom(explorationZoom(spec.width*density,spec.height*density,density,spec.indoor,bodyHeight).zoom,!!spec.talking),paintedCss=bodyHeight*zoom/density,cellHeight=paintedCss/(71/96),cellWidth=cellHeight*2/3;
const section=document.createElement('section');section.innerHTML=`<h2>${spec.label}</h2><p>${paintedCss.toFixed(1)} CSS px body height · ${Math.ceil(paintedCss*density)} device pixels · ${density}× display density</p><div class="row"></div>`;samples.append(section);
for(const[face,pixels]of frames.entries()){const source=document.createElement('canvas');source.width=pixels.width;source.height=pixels.height;source.getContext('2d').putImageData(new ImageData(pixels.data,pixels.width,pixels.height),0,0);const figure=document.createElement('figure'),canvas=document.createElement('canvas');canvas.style.width=`${cellWidth}px`;canvas.style.height=`${cellHeight}px`;canvas.width=Math.ceil(cellWidth*density);canvas.height=Math.ceil(cellHeight*density);canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);figure.append(canvas);const caption=document.createElement('figcaption');caption.textContent=facings[face];figure.append(caption);section.querySelector('.row').append(figure);}}
status.textContent=`${manifest.assets.length} native components · ${manifest.format.runtimeCell.join(' × ')} runtime cells · pose ${column} of 8 motion poses.`;if(pose==='animate')setTimeout(()=>{if(current===ticket)void render();},130);
}catch(error){document.querySelector('#error').textContent=error.message;status.textContent='Review failed';}}
document.querySelector('#bake').addEventListener('click',async()=>{const result=document.querySelector('#bake-result'),start=performance.now();result.textContent='Baking all 36 frames…';try{const pixels=await bakeAvatarPixels(recipeFor(cat),{catalogue:cat,preview:true}),mib=pixels.data.byteLength/1024/1024;result.textContent='36 frames · '+pixels.width+' × '+pixels.height+' atlas · '+mib.toFixed(1)+' MiB RGBA · '+(mib*2).toFixed(1)+' MiB canvas + GPU · '+((performance.now()-start)/1000).toFixed(2)+' s';}catch(error){result.textContent='Bake failed: '+error.message;}});
document.querySelector('#controls').addEventListener('change',event=>{document.querySelector('#bake-result').textContent='';if(['build','animation'].includes(event.target.id))refreshOptions();void render();});await render();
</script></html>
