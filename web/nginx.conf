map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log safe;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location /api/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }
  location /assets/ { expires 7d; add_header Cache-Control "public"; }
  location /audio/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ /index.html; }
}
