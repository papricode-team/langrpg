name: Game checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go service against a real PostgreSQL so integration tests run instead of skipping.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glotworld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glotworld_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # server/content.json is generated, not committed; it uses only Node built-ins.
      - run: node scripts/build-content.mjs
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go test -race -count=1 -timeout 30m ./...
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/glotworld_test?sslmode=disable

  # Lint, type checks, unit and tooling tests, and generated-content drift.
  web:
    runs-on: ubuntu-latest
    steps:
      # Art tests compare against reviewed proofs named in the catalogues, so this
      # is the only job that needs LFS content.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:tooling
      - run: npm run assets
      - run: node scripts/audit-dialogue-levels.mjs --check
      - run: npm run i18n
      - name: Generated content is committed
        run: git diff --exit-code -- server/curriculum.json server/course.json server/story_rules.json server/expeditions.json server/activity_boards.json web/src/data/course.json web/src/data/course-meta.json web/src/data/course-exercises-a1.json web/src/data/course-exercises-a2.json web/src/data/course-exercises-b1.json docs/audits/dialogue-levels.json web/src/data/syllabus.json server/syllabus.json docs/audits/pacing.json

  # Font floor and screenshot gallery against a running API and Vite server.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: node scripts/build-content.mjs
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - name: Check UI font floor and regenerate screenshots
        env:
          ATLAS_UI_URL: http://127.0.0.1:5187
        run: |
          # Previews read session-gated learning content through the development proxy.
          (cd server && DATA_PATH="$RUNNER_TEMP/atlas-ui-state.json" CONTENT_PATH="$GITHUB_WORKSPACE/server/content.json" go run .) > "$RUNNER_TEMP/atlas-ui-api.log" 2>&1 &
          api_server_pid=$!
          node node_modules/vite/bin/vite.js web --host 127.0.0.1 --port 5187 --strictPort > "$RUNNER_TEMP/atlas-ui-vite.log" 2>&1 &
          ui_server_pid=$!
          trap 'kill "$ui_server_pid" "$api_server_pid" 2>/dev/null || true; wait "$ui_server_pid" "$api_server_pid" 2>/dev/null || true' EXIT
          api_server_ready=false
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8097/api/health > /dev/null; then
              api_server_ready=true
              break
            fi
            sleep 1
          done
          if [ "$api_server_ready" != true ]; then
            cat "$RUNNER_TEMP/atlas-ui-api.log"
            exit 1
          fi
          ui_server_ready=false
          for attempt in {1..60}; do
            if curl --fail --silent "$ATLAS_UI_URL" > /dev/null; then
              ui_server_ready=true
              break
            fi
            if ! kill -0 "$ui_server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/atlas-ui-vite.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ui_server_ready" != true ]; then
            cat "$RUNNER_TEMP/atlas-ui-vite.log"
            exit 1
          fi
          npm run ui:check
      - name: Upload UI screenshot gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-gallery
          path: docs/screenshots/ui/
          if-no-files-found: warn

  # Production bundle, distribution budgets and the runtime image with its startup check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run budgets
      - run: docker build --file server/Dockerfile --tag glotworld:ci .
